[project]
name = "mcp-halflist"
version = "0.2.0"
description = "CI-first conformance testing and benchmarking CLI for MCP servers. Lint your MCP server before your users do."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Abhishekh Singh", email = "abhishekcp.singh67@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "testing", "cli", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
halflist = "halflist.cli:app"

[project.urls]
Homepage = "https://github.com/abhishekhsingh/mcp-halflist"
Repository = "https://github.com/abhishekhsingh/mcp-halflist"
Issues = "https://github.com/abhishekhsingh/mcp-halflist/issues"
Author = "https://abhishekhsingh.github.io/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halflist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
