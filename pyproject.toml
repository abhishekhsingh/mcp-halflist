[project]
name = "mcp-halflist"
dynamic = ["version"]
description = "CI-first conformance, security, and benchmarking CLI for MCP servers. Lint your MCP server before your users do."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Abhishekh Singh" }
]
maintainers = [
    { name = "Abhishekh Singh", email = "abhishekcp.singh67@gmail.com" }
]
keywords = ["mcp", "mcp-server", "mcp-testing", "model-context-protocol", "testing", "cli", "conformance", "linter", "security", "security-scanner", "prompt-injection", "tool-poisoning", "oauth", "streamable-http", "benchmarking", "ci", "github-actions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx2>=2.10.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
halflist = "halflist.cli:app"

[project.urls]
Homepage = "https://github.com/abhishekhsingh/mcp-halflist"
Repository = "https://github.com/abhishekhsingh/mcp-halflist"
Issues = "https://github.com/abhishekhsingh/mcp-halflist/issues"
Changelog = "https://github.com/abhishekhsingh/mcp-halflist/blob/main/CHANGELOG.md"
Action = "https://github.com/abhishekhsingh/halflist-action"
Author = "https://abhishekhsingh.github.io/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/halflist/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/halflist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned to the long-standing ruff defaults so CI does not change behaviour
# when a newer ruff release widens its default rule set.
select = ["E4", "E7", "E9", "F"]
